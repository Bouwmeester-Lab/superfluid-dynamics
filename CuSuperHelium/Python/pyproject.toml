[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cusuperhelium"
version = "0.1.0"
description = "Python bindings and tools for CuSuperHelium.dll, a CUDA boundary-integral solver for superfluid helium films"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]
analysis = ["h5py", "pandas", "scienceplots"]

[tool.setuptools]
packages = ["cusuperhelium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
